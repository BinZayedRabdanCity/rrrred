<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>END // ACCESS</title>
<style>
  :root {
    --bg: #050505;
    --panel: #0a0a0a;
    --red: #ff1f1f;
    --red2: #8b0000;
    --text: #f2f2f2;
    --muted: #8f8f8f;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", Courier, monospace;
  }

  body {
    overflow-x: hidden;
    background:
      radial-gradient(circle at 50% 20%, rgba(255,31,31,.08), transparent 35%),
      linear-gradient(#050505, #020202);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 4px
    );
    mix-blend-mode: overlay;
  }

  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .06;
    z-index: 19;
    background-image:
      repeating-radial-gradient(circle at 17% 32%, rgba(255,0,0,.8) 0 1px, transparent 1px 3px);
    animation: flicker .16s infinite alternate;
  }

  @keyframes flicker {
    from { opacity: .035; transform: translateY(0); }
    to { opacity: .07; transform: translateY(1px); }
  }

  .screen {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .terminal {
    width: min(920px, 94vw);
    min-height: 520px;
    background: rgba(7,7,7,.94);
    border: 1px solid var(--red2);
    box-shadow:
      0 0 18px rgba(255,0,0,.15),
      inset 0 0 24px rgba(255,0,0,.04);
    position: relative;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 14px;
    border-bottom: 1px solid #310000;
    color: var(--red);
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .content {
    padding: 46px 44px;
  }

  .brand {
    font-size: clamp(28px, 6vw, 64px);
    color: var(--red);
    font-weight: 800;
    letter-spacing: 4px;
    margin: 0 0 8px;
    text-shadow: 3px 0 #420000;
  }

  .sub {
    color: #a9a9a9;
    margin-bottom: 42px;
    font-size: 14px;
  }

  .prompt {
    color: #cfcfcf;
    margin-bottom: 14px;
  }

  .prompt span { color: var(--red); }

  .login-btn {
    appearance: none;
    border: 1px solid var(--red);
    background: transparent;
    color: var(--red);
    font: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 14px 28px;
    cursor: pointer;
    text-transform: uppercase;
    transition: .18s ease;
    box-shadow: inset 0 0 0 rgba(255,0,0,0);
  }

  .login-btn:hover {
    background: var(--red);
    color: #050505;
    box-shadow: 0 0 24px rgba(255,0,0,.4);
    transform: translateY(-1px);
  }

  .blink::after {
    content: "_";
    animation: blink 0.8s steps(1) infinite;
    color: var(--red);
  }

  @keyframes blink { 50% { opacity: 0; } }

  #roster {
    display: none;
  }

  .roster-head {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 28px;
  }

  .roster-head h2 {
    margin: 0;
    color: var(--red);
    font-size: 28px;
    letter-spacing: 3px;
  }

  .small {
    color: var(--muted);
    font-size: 12px;
  }

  .list {
    display: grid;
    gap: 8px;
  }

  .person {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    border-left: 3px solid #4a0000;
    border-bottom: 1px solid #1e1e1e;
    background: linear-gradient(90deg, rgba(255,0,0,.055), transparent 55%);
    transition: .16s ease;
  }

  .person:hover {
    border-left-color: var(--red);
    background: linear-gradient(90deg, rgba(255,0,0,.12), transparent 70%);
    transform: translateX(4px);
  }

  .idx { color: #6f6f6f; }
  .name { color: #f0f0f0; font-weight: 700; letter-spacing: 1px; }
  .status { color: var(--red); font-size: 12px; }

  .footerline {
    margin-top: 28px;
    color: #5e5e5e;
    font-size: 12px;
  }

  .glitch {
    animation: glitch 0.35s linear 2;
  }

  @keyframes glitch {
    0% { transform: translate(0); filter: none; }
    25% { transform: translate(-3px, 1px); filter: contrast(1.4); }
    50% { transform: translate(3px, -1px); }
    75% { transform: translate(-1px, 0); }
    100% { transform: translate(0); }
  }

  @media (max-width: 650px) {
    .content { padding: 32px 22px; }
    .person { grid-template-columns: 34px 1fr; }
    .status { grid-column: 2; }
    .topbar { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="noise"></div>

<main class="screen">
  <section class="terminal" id="terminal">
    <div class="topbar">
      <span>END//ACCESS TERMINAL</span>
      <span>NODE: END</span>
    </div>

    <div class="content" id="loginScreen">
      <h1 class="brand">END</h1>
      <div class="sub">[ END legacy secure terminal interface ]</div>

      <div class="prompt">root@end:<span>~$</span> authentication required</div>
      <button class="login-btn" id="loginBtn">[ LogIn ]</button>
      <div class="footerline blink">waiting for input</div>
    </div>

    <div class="content" id="roster">
      <div class="roster-head">
        <div>
          <h2>IDENTITY LIST</h2>
          <div class="small">AUTHORIZED NAMES // END ARCHIVE</div>
        </div>
        <div class="small">ACCESS: GRANTED</div>
      </div>

      <div class="list" id="personList"></div>

      <div class="footerline blink">session active</div>
    </div>
  </section>
</main>

<script>
  const people = [
    "PrimeKhaled",
    "HorrorLog",
    "DeadMan",
    "Alketbi",
    "Bu 7meed",
    "Raymond"
  ];

  const loginBtn = document.getElementById('loginBtn');
  const loginScreen = document.getElementById('loginScreen');
  const roster = document.getElementById('roster');
  const personList = document.getElementById('personList');
  const terminal = document.getElementById('terminal');

  loginBtn.addEventListener('click', () => {
    terminal.classList.add('glitch');
    loginBtn.textContent = '[ ACCESSING... ]';

    setTimeout(() => {
      loginScreen.style.display = 'none';
      roster.style.display = 'block';
      personList.innerHTML = '';

      people.forEach((person, i) => {
        const row = document.createElement('div');
        row.className = 'person';
        row.innerHTML = `
          <div class="idx">${String(i + 1).padStart(2, '0')}</div>
          <div class="name">${person}</div>
          <div class="status">OFFLINE</div>
        `;
        personList.appendChild(row);
      });

      terminal.classList.remove('glitch');
    }, 650);
  });
</script>
</body>
</html>
